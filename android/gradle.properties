org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.caching=true
kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
# Maven Central rate-limits GitHub's shared CI runners (HTTP 429). Gradle's defaults are 3 attempts
# starting 125 ms apart, so all three landed inside one rate-limit window and it gave up with
# "could not resolve plugin artifact" (3 of the first 4 CI runs, 2026-11-26). Here: 6 attempts,
# the wait doubling from 1.5 s. Names as in Gradle 9.6.0's ErrorHandlingModuleComponentRepository.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=1500
