name: Linux build

# Builds the Linux AppImage + tar.gz on GitHub's free Ubuntu runner.
# PyInstaller cannot cross-compile, so this workflow IS the Linux build
# machine. FULL feature build since the 2026-10-11 port (owner decision):
# Play/IPTV tab included via X11 embedding (the app forces
# QT_QPA_PLATFORM=xcb → XWayland), libmpv + dependency closure bundled,
# and the DeepSeek shared key embedded from the EMBED_SHARED_DEEPSEEK_API_KEY
# secret (same exposure as the public Windows setup exe; git stays keyless).
# No signing exists on Linux at all — an AppImage runs as soon as it has
# the exec bit (chmod +x), so there is no Gatekeeper/SmartScreen step.
#
# Runner is pinned to ubuntu-24.04 (glibc 2.39 floor: Ubuntu 24.04+,
# Debian 13, Fedora 40+, Arch). ubuntu-22.04 entered deprecation
# 2026-09-17 (actions/runner-images#14254) — do not go back there; a
# wider-compat manylinux_2_28 container job is the upgrade path if users
# on older distros ever ask.
#
# Trigger: every push to this branch (workflow_dispatch only works once
# the file reaches the default branch) + manual dispatch after that.
on:
  workflow_dispatch:
  push:
    branches: [linux-port]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system libraries (Qt/Chromium + libmpv runtime deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libasound2t64 libpulse0 \
            libwayland-client0 libwayland-cursor0 libwayland-server0 \
            libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libx11-6 \
            libdrm2 libgbm1 libegl1 libgl1 \
            libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0 \
            libmpv2 patchelf

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Not in requirements.txt but imported by the app (dev machines
          # carry them; CI must be explicit). python-vlc is the OPTIONAL
          # VLC fallback backend (pure ctypes wrapper — only activates on
          # machines with a system VLC; libvlc itself is not bundled).
          pip install cryptography defusedxml Pillow PyInstaller python-vlc

      - name: Embed shared DeepSeek key (from secret, obfuscated)
        env:
          EMBED_SHARED_DEEPSEEK_API_KEY: ${{ secrets.EMBED_SHARED_DEEPSEEK_API_KEY }}
        run: |
          # Writes an obfuscated _embedded_keys.py at the repo root ONLY when
          # the secret exists; values never appear in logs. app_linux.spec
          # bundles it via the conditional _embedded_keys hiddenimport.
          python packaging/gen_embedded_keys_from_env.py

      - name: Offscreen boot smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --no-sandbox --disable-dev-shm-usage"
        run: |
          # The script carries its own 120s hang watchdog (faulthandler).
          python -u packaging/verify_boot.py

      - name: Read app version
        id: ver
        run: |
          VER=$(sed -nE 's/^#define MyAppVersion "([^"]+)"/\1/p' packaging/installer.iss | head -1)
          echo "version=${VER:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Build onedir (PyInstaller)
        run: python -m PyInstaller packaging/app_linux.spec --clean --noconfirm

      - name: Bundle libmpv runtime closure (_internal/mpvlibs)
        run: |
          # libmpv is dlopen'ed via ctypes, so PyInstaller/linuxdeploy never
          # see it in any ELF NEEDED scan — collect it by hand. Copy
          # libmpv.so.2 plus its transitive deps (ldd walk, resolved through
          # symlinks) EXCEPT the glibc core and the system graphics stack
          # (GL/EGL/GBM/DRM/vulkan must stay driver-matched on the target),
          # then point every copied lib at its neighbours via $ORIGIN rpath
          # so loading needs no LD_LIBRARY_PATH — spawned subprocesses
          # (system ffmpeg, Jackett) can never pick these up by accident.
          python - <<'PYEOF'
          import os, re, subprocess, shutil, glob, stat

          skip_re = re.compile(
              r"^(ld-linux|libc\.so|libm\.so|libpthread\.so|libdl\.so|librt\.so|"
              r"libresolv\.so|libutil\.so|libcrypt\.so|libanl\.so|"
              r"libGL\.|libGLdispatch\.|libEGL\.|libGLES\.|libglapi\.|"
              r"libgbm\.|libdrm\.|libwayland-|libvulkan\.|libGLX\.|libOpenGL\.)")

          dest = "dist/DeepFlux/_internal/mpvlibs"
          os.makedirs(dest, exist_ok=True)
          root = None
          for pat in ("/usr/lib/x86_64-linux-gnu/libmpv.so.2*",
                      "/lib/x86_64-linux-gnu/libmpv.so.2*"):
              hits = glob.glob(pat)
              if hits:
                  root = os.path.realpath(hits[0])
                  break
          assert root, "libmpv.so.2 not found — is libmpv2 installed?"
          print("libmpv root:", root)

          queue, seen, copied = [root], set(), []
          while queue:
              path = queue.pop()
              if path in seen:
                  continue
              seen.add(path)
              out = subprocess.run(["ldd", path], capture_output=True, text=True).stdout
              for line in out.splitlines():
                  parts = line.strip().split("=>")
                  if len(parts) != 2:
                      continue
                  lib = parts[1].strip().split()[0] if parts[1].strip() else ""
                  if not lib or not os.path.isabs(lib):
                      continue
                  lib = os.path.realpath(lib)
                  base = os.path.basename(lib)
                  if skip_re.match(base):
                      continue
                  if lib not in seen:
                      queue.append(lib)
              dst = os.path.join(dest, os.path.basename(path))
              if not os.path.exists(dst):
                  shutil.copy2(path, dst)
                  copied.append(os.path.basename(path))
          print(f"copied {len(copied)} libs into mpvlibs")
          assert os.path.basename(root) in (os.path.basename(f) for f in glob.glob(dest + "/*")), "libmpv itself missing"
          for so in glob.glob(dest + "/*.so*"):
              os.chmod(so, os.stat(so).st_mode | stat.S_IRUSR | stat.S_IWUSR | stat.S_IRGRP | stat.S_IROTH)
          PYEOF
          # $ORIGIN rpath on every bundled lib: each resolves its neighbours
          # internally, no LD_LIBRARY_PATH anywhere.
          for so in dist/DeepFlux/_internal/mpvlibs/*.so*; do
            patchelf --set-rpath '$ORIGIN' "$so"
          done
          echo "mpvlibs contents:" && ls dist/DeepFlux/_internal/mpvlibs | head -40

      - name: Package tar.gz
        run: |
          cd dist
          tar -czf "DeepFlux-${{ steps.ver.outputs.version }}-Linux-x86_64.tar.gz" DeepFlux

      - name: Package AppImage (linuxdeploy)
        env:
          # 24.04 runners have no libfuse2; extract-and-run instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          # linuxdeploy bundles the SYSTEM library closure (nss/alsa/xcb/…)
          # into the image; a bare PyInstaller onedir would require users
          # to apt-install those libs themselves.
          curl -fL -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          APPDIR=build/AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib/DeepFlux" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/512x512/apps"
          cp -a dist/DeepFlux/. "$APPDIR/usr/lib/DeepFlux/"
          printf '#!/bin/sh\nhere="$(dirname "$(readlink -f "$0")")"\nexec "$here/../lib/DeepFlux/DeepFlux" "$@"\n' \
            > "$APPDIR/usr/bin/DeepFlux"
          chmod +x "$APPDIR/usr/bin/DeepFlux"
          cat > "$APPDIR/usr/share/applications/DeepFlux.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=DeepFlux
          Comment=All-in-one media and download center
          Exec=DeepFlux
          Icon=DeepFlux
          Categories=Network;FileTransfer;
          EOF
          # linuxdeploy only accepts SQUARE icons in standard sizes — the
          # source logo (DeepFlux5.png) is not square, so pad it onto a
          # square transparent canvas and downscale to 512x512.
          python - <<'PYEOF'
          from PIL import Image
          img = Image.open("DeepFlux5.png").convert("RGBA")
          side = max(img.size)
          canvas = Image.new("RGBA", (side, side), (0, 0, 0, 0))
          canvas.paste(img, ((side - img.width) // 2, (side - img.height) // 2))
          canvas.resize((512, 512), Image.LANCZOS).save(
              "build/AppDir/usr/share/icons/hicolor/512x512/apps/DeepFlux.png")
          PYEOF
          # linuxdeploy resolves NEEDED entries via ldconfig + usr/lib only —
          # NOT appdir subdirectories. PyInstaller's onedir keeps wheel libs
          # (incl. hashed names like ctranslate2's libgomp-e985bcbb.so.1.0.0)
          # in _internal/, so point the resolver there or bundling fails with
          # "Could not find dependency".
          export LD_LIBRARY_PATH="$PWD/dist/DeepFlux/_internal:$LD_LIBRARY_PATH"
          ./linuxdeploy.AppImage --appdir "$APPDIR" \
            --desktop-file "$APPDIR/usr/share/applications/DeepFlux.desktop" \
            --icon-file "$APPDIR/usr/share/icons/hicolor/512x512/apps/DeepFlux.png" \
            --output appimage
          OUT="$(ls -1 ./*.AppImage 2>/dev/null | head -1)"
          mv "$OUT" "dist/DeepFlux-${{ steps.ver.outputs.version }}-Linux-x86_64.AppImage"

      - name: AppImage smoke test (packaged binary runs)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x dist/*.AppImage
          QT_QPA_PLATFORM=offscreen ./dist/DeepFlux-*-Linux-x86_64.AppImage --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepFlux-${{ steps.ver.outputs.version }}-Linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.tar.gz
          retention-days: 30
          if-no-files-found: error
