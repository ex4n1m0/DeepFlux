[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deeptorrent"
version = "4.0.0"
description = "LLM-Assisted Torrent Download Manager"
requires-python = ">=3.11"
dependencies = [
    "libtorrent>=2.0.0",
    "PySide6>=6.5.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "irc>=20.4.0,<21",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "pyinstaller>=6.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "agent*", "gui*", "ircmgr*", "dlmgr*", "iptv*", "native_messaging*", "infra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
