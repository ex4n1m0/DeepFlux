[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deeptorrent"
version = "7.7"
description = "LLM-Assisted Torrent Download Manager"
requires-python = ">=3.11"
dependencies = [
    "libtorrent>=2.0.0",
    "PySide6>=6.5.0",
    "requests>=2.28.0",
    "curl_cffi>=0.13.0",
    "ddgs>=9.0.0",
    "python-mpv>=1.0.0",
    "python-vlc>=3.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "m3u8>=3.0.0",
    "pycryptodome>=3.19.0",
    "PyNaCl>=1.5.0",
    "argon2-cffi>=23.1.0",
    "yt-dlp>=2026.10.26",
    "faster-whisper>=1.1.0,<2",
    "cryptography>=41.0.0",
    "Pillow>=10.0.0",
    "defusedxml>=0.7.1",
    "irc>=20.4.0,<21",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "pyinstaller>=6.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "agent*", "gui*", "ircmgr*", "dlmgr*", "iptv*", "native_messaging*", "infra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
