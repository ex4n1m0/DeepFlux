version: "3.8"

services:
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: deeptorrent-jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - AUTO_UPDATE=true
    volumes:
      - jackett-config:/config
    ports:
      - "9117:9117"
    restart: unless-stopped
    networks:
      - deeptorrent

volumes:
  jackett-config:

networks:
  deeptorrent:
    driver: bridge
